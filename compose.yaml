name: steam-playtime

services:
  server:
    build: .
    command: ["steam-playtime", "server"]
    restart: unless-stopped
    environment:
      STEAM_PLAYTIME_DATA_DIR: /data
      STEAM_PLAYTIME_CONFIG: /data/config.toml
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - ${SERVER_DATA_DIR:-./server-data}:/data

  agent:
    profiles: ["agent"]
    build: .
    command: ["steam-playtime", "agent"]
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      STEAM_PLAYTIME_DATA_DIR: /data
      STEAM_PLAYTIME_CONFIG: /data/config.toml
      STEAM_LOG_PATH: /steam-logs/gameprocess_log.txt
      SERVER_URL: ${SERVER_URL:-}
      API_TOKEN: ${API_TOKEN:-}
      DEVICE_NAME: ${DEVICE_NAME:-}
      TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - ${HOST_STEAM_LOG_DIR:?Set HOST_STEAM_LOG_DIR to Steam's logs directory}:/steam-logs:ro
      - ${AGENT_DATA_DIR:-./agent-data}:/data
