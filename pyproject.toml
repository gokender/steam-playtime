[project]
name = "steam-playtime"
version = "0.2.0"
description = "Local-first Steam playtime tracking"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
steam-playtime = "steam_playtime.cli:main"

[dependency-groups]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
