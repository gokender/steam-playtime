[project]
name = "steam-playtime"
dynamic = ["version"]
description = "Local-first Steam playtime tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "platformdirs>=4.3",
    "typer>=0.15",
    "uvicorn>=0.34",
]

[project.scripts]
steam-playtime = "steam_playtime.cli:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "steam_playtime.__version__"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
