name: Package Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          expected_tag="v$(PYTHONPATH=src python -c 'from steam_playtime import __version__; print(__version__)')"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $expected_tag." >&2
            exit 1
          fi

      - name: Build and test Linux package
        run: ./scripts/package-linux-x86_64.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: steam-playtime-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
          fi
