name: Package Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test Linux package
        run: ./scripts/package-linux-x86_64.sh

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: steam-playtime-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error
